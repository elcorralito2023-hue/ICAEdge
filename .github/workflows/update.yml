name: Cron de Busqueda y Despliegue de Panel

on:
  schedule:
    - cron: '0 5-21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  cron-job:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Cron de Busqueda
        run: |
          python scraper.py

      - name: Guardar listings.json actualizado en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: actualización de viviendas (ejecución ${{ github.run_number }})" || echo "No changes to commit"
          git push || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Empaquetar artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar Panel
        id: deployment
        uses: actions/deploy-pages@v4
