name: Actualización Cada Hora (07:00 - 23:00) y Despliegue en GitHub Pages

on:
  schedule:
    # Se ejecuta cada hora desde las 07:00 hasta las 23:00 (hora de España)
    - cron: '0 5-21 * * *'
  workflow_dispatch: # Permite ejecución manual si se desea

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Ejecutar recolector de viviendas
        run: |
          python scraper.py --location "Las Rozas, Majadahonda, Alcorcón, Móstoles" --max-price 750000

      - name: 4. Guardar cambios en listings.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add listings.json || true
          git diff-index --quiet HEAD || git commit -m "chore(data): actualización horaria de viviendas"
          git push || true

      - name: 5. Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 6. Empaquetar para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 7. Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
